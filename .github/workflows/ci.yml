# Runs the Playwright e2e suite and publishes the HTML report to GitHub Pages.
# The report is deployed even when tests fail (`!cancelled()`), so failures are
# always browsable at the Pages URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; later runs wait rather than cancel an
# in-flight report upload.
concurrency:
  group: pages

jobs:
  test-and-publish-report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite deliberately targets a single Chromium engine (chromium +
      # mobile projects), so no other browser binary is needed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Two configs: the API-only suite never launches a browser (request
      # fixture only, screenshots off); the UI suite runs Chromium. Each run
      # writes a blob report (both are named report.zip, so their dirs are
      # kept separate) that gets copied into blob-reports/all for the merge.
      - name: Run Playwright API tests (no browser)
        run: |
          mkdir -p blob-reports/all
          npx playwright test --config playwright.api.config.ts
          cp blob-reports/api/report.zip blob-reports/all/api.zip
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-reports/api

      - name: Run Playwright UI tests
        run: |
          npx playwright test --config playwright.config.ts
          cp blob-reports/ui/report.zip blob-reports/all/ui.zip
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-reports/ui

      - name: Merge blob reports into one HTML report
        run: npx playwright merge-reports --reporter html blob-reports/all
        env:
          PLAYWRIGHT_HTML_OUTPUT: playwright-report
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: playwright-report

      - id: deployment
        uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}

      - name: Upload failure videos and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7